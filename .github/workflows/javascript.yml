name: JavaScript

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ruby -e 'print Dir["app/assets/javascripts/rails_markup/toolbar/*.js"].sort.map { |file| File.read(file) }.join("\n")' | node --check --input-type=commonjs
